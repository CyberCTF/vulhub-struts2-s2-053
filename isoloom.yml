# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Apache Struts2 S2-053 Freemarker OGNL Injection (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's struts2/s2-053, vendored in app/, run from the published image vulhub/struts2:s2-053.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-struts2-s2-053

networks:
  lab: { cidr: 10.61.13.0/24, internet: false }

machines:
  struts2:
    networks: { lab: 10 }
    services: [{ port: 8080, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      image: vulhub/struts2:s2-053

checks:
  - name: the application answers
    http: http://struts2:8080/hello.action
    wait: 120
  - name: hello.action renders the submission form
    script: checks/app.sh
    wait: 60

message: |
  A Struts2 application answers at http://localhost:{{ machines.struts2.services.0.publish }}/hello.action.
  The page renders what you submit through a Freemarker template.
